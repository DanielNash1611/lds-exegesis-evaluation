<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exegesis Evaluation</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: Canvas;
        color: CanvasText;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 14px;
      }

      main {
        display: grid;
        gap: 14px;
        max-width: 920px;
        margin: 0 auto;
      }

      header {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: start;
        border-bottom: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
        padding-bottom: 12px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: 1.15rem;
        line-height: 1.25;
        font-weight: 700;
      }

      h2 {
        font-size: 0.95rem;
        line-height: 1.25;
        font-weight: 700;
      }

      h3 {
        font-size: 0.88rem;
        line-height: 1.3;
        font-weight: 650;
      }

      p,
      li,
      a {
        font-size: 0.88rem;
        line-height: 1.45;
      }

      .muted {
        color: color-mix(in srgb, CanvasText 68%, transparent);
      }

      .score {
        min-width: 72px;
        border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
        border-radius: 8px;
        padding: 8px 10px;
        text-align: center;
      }

      .score strong {
        display: block;
        font-size: 1rem;
      }

      .panel {
        display: grid;
        gap: 8px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 8px;
      }

      .card {
        border: 1px solid color-mix(in srgb, CanvasText 16%, transparent);
        border-radius: 8px;
        padding: 10px;
        display: grid;
        gap: 6px;
        min-width: 0;
      }

      .badge {
        width: fit-content;
        max-width: 100%;
        border: 1px solid color-mix(in srgb, CanvasText 16%, transparent);
        border-radius: 999px;
        padding: 2px 7px;
        font-size: 0.72rem;
        line-height: 1.2;
        color: color-mix(in srgb, CanvasText 72%, transparent);
        overflow-wrap: anywhere;
      }

      a {
        color: LinkText;
        overflow-wrap: anywhere;
      }

      .empty {
        border: 1px dashed color-mix(in srgb, CanvasText 18%, transparent);
        border-radius: 8px;
        padding: 10px;
        color: color-mix(in srgb, CanvasText 66%, transparent);
      }

      @media (max-width: 520px) {
        body {
          padding: 10px;
        }

        header {
          grid-template-columns: 1fr;
        }

        .score {
          width: fit-content;
        }
      }
    </style>
  </head>
  <body>
    <main id="root">
      <p class="empty">Waiting for evaluation result.</p>
    </main>
    <script>
      const root = document.getElementById("root");

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function linkHtml(link) {
        if (!link || !link.url) return "";
        return `<a href="${escapeHtml(link.url)}" target="_blank" rel="noreferrer">${escapeHtml(link.label || "Open source")}</a>`;
      }

      function cardHtml(card) {
        const links = Array.isArray(card.links) ? card.links.map(linkHtml).filter(Boolean).join(" ") : "";
        return `
          <article class="card">
            ${card.badge ? `<span class="badge">${escapeHtml(card.badge)}</span>` : ""}
            <h3>${escapeHtml(card.title)}</h3>
            ${card.subtitle ? `<p class="muted">${escapeHtml(card.subtitle)}</p>` : ""}
            <p>${escapeHtml(card.body)}</p>
            ${links ? `<p>${links}</p>` : ""}
          </article>
        `;
      }

      function sectionHtml(title, cards) {
        const list = Array.isArray(cards) ? cards : [];
        return `
          <section class="panel">
            <h2>${escapeHtml(title)}</h2>
            ${
              list.length
                ? `<div class="grid">${list.map(cardHtml).join("")}</div>`
                : `<p class="empty">No cards returned for this section.</p>`
            }
          </section>
        `;
      }

      function render(payload) {
        if (!payload || !payload.ui) {
          const errors = payload && Array.isArray(payload.validationErrors) ? payload.validationErrors : [];
          root.innerHTML = `
            <section class="panel">
              <h1>Evaluation validation failed</h1>
              ${
                errors.length
                  ? `<ul>${errors.map((error) => `<li>${escapeHtml(error.path)}: ${escapeHtml(error.message)}</li>`).join("")}</ul>`
                  : `<p class="empty">No structured evaluation payload was available.</p>`
              }
            </section>
          `;
          return;
        }

        const ui = payload.ui;
        root.innerHTML = `
          <header>
            <div class="panel">
              <h1>${escapeHtml(ui.title)}</h1>
              ${ui.subtitle ? `<p class="muted">${escapeHtml(ui.subtitle)}</p>` : ""}
              <p>${escapeHtml(ui.summary)}</p>
            </div>
            <div class="score">
              <strong>${escapeHtml(ui.score && ui.score.label)}</strong>
              <span class="muted">score</span>
            </div>
          </header>
          <section class="card">
            <span class="badge">Support assessment</span>
            <h2>${escapeHtml(ui.supportAssessment && ui.supportAssessment.classification)}</h2>
            <p>${escapeHtml(ui.supportAssessment && ui.supportAssessment.explanation)}</p>
          </section>
          ${sectionHtml("Textual Grounding", ui.sections && ui.sections.textualGrounding)}
          ${sectionHtml("Modern Prophetic Witnesses", ui.sections && ui.sections.modernPropheticWitnesses)}
          ${sectionHtml("LDS Scholarship", ui.sections && ui.sections.ldsScholarship)}
          ${sectionHtml("Assumptions", ui.sections && ui.sections.assumptions)}
          ${sectionHtml("Alternative Readings", ui.sections && ui.sections.alternatives)}
          ${sectionHtml("Cautions And Revisions", ui.sections && ui.sections.cautions)}
          <p class="muted">${escapeHtml(ui.closingReminder)}</p>
        `;
      }

      function receiveToolResult(event) {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;
        if (message.method === "ui/notifications/tool-result") {
          render(message.params && message.params.structuredContent);
        }
      }

      window.addEventListener("message", receiveToolResult, { passive: true });

      if (window.openai && window.openai.toolOutput) {
        render(window.openai.toolOutput);
      }
    </script>
  </body>
</html>
